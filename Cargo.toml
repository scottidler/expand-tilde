[package]
name = "expand-tilde"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Expand a leading ~ in a path, with optional serde support for config fields"
repository = "https://github.com/scottidler/expand-tilde"

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0", optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
dirs = "6.0.0"
