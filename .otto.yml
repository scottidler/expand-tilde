otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"

tasks:
  # Whitespace and convention linting
  lint:
    help: "Run whitespace and convention linting"
    bash: |
      whitespace -r
      echo ""
      echo "=== Deny _variable binding pattern ==="
      if grep -rn --include='*.rs' -P '(\blet\s+(mut\s+)?|[(,]\s*|\|\s*|\bfor\s+)_[a-zA-Z]' src/ tests/; then
        echo ""
        echo "❌ Found _variable binding pattern."
        echo "   Use _ to discard or use the variable — never _varname."
        exit 1
      fi
      echo "✅ No _variable patterns found"

  # Code quality checks
  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --all-targets --all-features
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --all-targets --all-features -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all --check
      echo ""
      echo "✅ All checks passed!"

  # Run tests
  test:
    help: "Run all tests"
    bash: |
      echo "=== Default features (no serde) ==="
      cargo test
      echo ""
      echo "=== All features (serde wrappers) ==="
      cargo test --all-features

  # Full CI pipeline
  ci:
    help: "Full CI pipeline (lint + check + test in parallel)"
    before: [lint, check, test]
    bash: |
      echo "✅ All CI checks passed!"

  # Clean build artifacts
  clean:
    help: "Clean build artifacts"
    bash: |
      cargo clean
      echo "✅ Build artifacts cleaned"
